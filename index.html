<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Lutcraft — Color Grading &amp; LUT Creation Studio. Create your look. Craft your colour.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#F5F4F0">
    <title>Lutcraft — Color Grading &amp; LUT Creation Studio</title>
    <!-- Lutcraft mark: an indigo tile carrying the colour-wheel handle —
         the app's signature interaction, reduced to two shapes. Inline data
         URI so the icon can never be blocked or 404 offline. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237773D9'/%3E%3Ccircle cx='15' cy='17' r='8.6' fill='none' stroke='%23fff' stroke-opacity='0.5' stroke-width='2.8'/%3E%3Ccircle cx='21.2' cy='10.6' r='4' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/index.css">
    <script>
        // Paint the persisted theme before first paint. React re-applies it on
        // mount; doing it here as well means a Dark Studio reload never flashes
        // the Light Studio background. Fails silently if storage is unavailable.
        (function () {
            try {
                var raw = window.localStorage.getItem('lutcraft.settings.v1');
                var theme = raw ? JSON.parse(raw).theme : null;
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute('content', '#171717');
                }
            } catch (e) { /* defaults to Light Studio */ }
        })();
    </script>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
